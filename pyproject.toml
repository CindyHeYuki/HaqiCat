[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "haqicat"
version = "0.1.0"
description = "A Windows desktop pet inspired by the Haqi Cat character."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "PySide6>=6.7,<7",
]

[project.optional-dependencies]
build = [
    "PyInstaller>=6.0,<7",
]
dev = [
    "pytest>=8.0,<9",
    "Pillow>=10,<13",
]

[project.scripts]
haqicat = "haqicat.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

